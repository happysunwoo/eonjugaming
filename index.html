<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍티컬 오퍼레이션: 2D 텍티컬 슈터</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e6ed;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            background: #12161f;
        }
        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .panel {
            background: rgba(16, 22, 30, 0.75);
            border: 1px solid rgba(80, 100, 120, 0.4);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .stat-label {
            font-size: 11px;
            color: #8a9ba8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .health-bar-bg {
            width: 220px;
            height: 16px;
            background: rgba(20, 30, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3b30, #ff9500, #34c759);
            transition: width 0.1s ease-out;
        }
        .ammo-display {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .ammo-current {
            font-size: 36px;
            font-weight: 900;
            color: #4cd964;
        }
        .ammo-max {
            font-size: 18px;
            color: #8e8e93;
        }
        .reload-text {
            color: #ff9500;
            font-weight: bold;
            font-size: 14px;
            animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .controls-info {
            font-size: 12px;
            color: #99aab5;
            line-height: 1.6;
        }
        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: #fff;
            margin: 0 2px;
        }
        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #game-over.active {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over h1 {
            font-size: 54px;
            color: #ff3b30;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.5);
        }
        #game-over p {
            font-size: 20px;
            color: #8e8e93;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
            background: linear-gradient(135deg, #34495e, #2980b9);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="hud-top">
            <div class="panel">
                <div class="stat-label">작전 대원 상태</div>
                <div id="hp-text" class="stat-value" style="color:#34c759;">100 %</div>
                <div class="health-bar-bg">
                    <div id="hp-bar" class="health-bar-fill"></div>
                </div>
            </div>

            <div class="panel" style="text-align: center;">
                <div class="stat-label">처치한 적</div>
                <div id="score-text" class="stat-value" style="color:#ffcc00;">0</div>
            </div>

            <div class="panel" style="text-align: right;">
                <div class="stat-label">잔여 탄약</div>
                <div id="ammo-panel" class="ammo-display">
                    <span id="ammo-current" class="ammo-current">30</span>
                    <span class="ammo-max">/ 30</span>
                </div>
                <div id="reload-status" class="reload-text" style="display: none;">[ R ] 장전 중...</div>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="panel controls-info">
                <div><span class="key">A</span> <span class="key">D</span> 좌우 이동</div>
                <div><span class="key">W</span> 점프 (지형 조작 가능)</div>
                <div><span class="key">Space</span> 마우스 방향 사격</div>
                <div><span class="key">R</span> 탄창 재장전</div>
            </div>
            
            <div class="panel" style="font-size: 11px; color: #6c7a89; text-align: right;">
                <div>부위별 데미지 판정:</div>
                <div style="color:#ff3b30; font-weight:bold;">머리: 헤드샷 (크리티컬 x3)</div>
                <div style="color:#ffcc00;">몸통: 일반 데미지</div>
                <div style="color:#aaaaaa;">다리: 감소된 데미지</div>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over">
        <h1>작전 실패</h1>
        <p id="final-stats">처치한 적: 0명</p>
        <button class="btn" onclick="restartGame()">재작전 투입</button>
    </div>
</div>

<script>
// Audio Synthesizer for realistic tactical sounds without external files
class SoundEngine {
    constructor() {
        this.ctx = null;
    }
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    playShoot() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Noise buffer for realistic gunshot blast
        const bufferSize = this.ctx.sampleRate * 0.15;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.15);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Low frequency thud
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        oscGain.gain.setValueAtTime(0.7, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
    }
    playHit(isHeadshot = false) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isHeadshot ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(isHeadshot ? 800 : 300, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
    }
    playReload() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Mechanical click sound
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.setValueAtTime(1200, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }
    playJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
    }
}

const sounds = new SoundEngine();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let screenWidth = window.innerWidth;
let screenHeight = window.innerHeight;
canvas.width = screenWidth;
canvas.height = screenHeight;

window.addEventListener('resize', () => {
    screenWidth = window.innerWidth;
    screenHeight = window.innerHeight;
    canvas.width = screenWidth;
    canvas.height = screenHeight;
});

// Map Boundaries (Wide Map)
const WORLD_WIDTH = 3200;
const WORLD_HEIGHT = 900;
const GRAVITY = 0.55;

// Camera System
const camera = {
    x: 0,
    y: 0,
    shakeTime: 0,
    shakeIntensity: 0,
    triggerShake(intensity, duration) {
        this.shakeIntensity = intensity;
        this.shakeTime = duration;
    },
    update(targetX, targetY) {
        // Smooth camera follow
        const destX = targetX - screenWidth / 2;
        const destY = targetY - screenHeight / 2;
        this.x += (destX - this.x) * 0.1;
        this.y += (destY - this.y) * 0.1;

        // Clamp to world boundaries
        this.x = Math.max(0, Math.min(WORLD_WIDTH - screenWidth, this.x));
        this.y = Math.max(0, Math.min(WORLD_HEIGHT - screenHeight, this.y));

        // Camera Shake effect
        if (this.shakeTime > 0) {
            this.x += (Math.random() - 0.5) * this.shakeIntensity;
            this.y += (Math.random() - 0.5) * this.shakeIntensity;
            this.shakeTime--;
        }
    }
};

// Controls tracking
const keys = {
    a: false,
    d: false,
    w: false,
    space: false,
    r: false
};

const mouse = {
    x: 0,
    y: 0,
    worldX: 0,
    worldY: 0
};

window.addEventListener('keydown', (e) => {
    sounds.init();
    if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') keys.a = true;
    if (e.key === 'd' || e.key === 'D' || e.key === 'ㅇ') keys.d = true;
    if (e.key === 'w' || e.key === 'W' || e.key === 'ㅈ') keys.w = true;
    if (e.code === 'Space') keys.space = true;
    if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') keys.r = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') keys.a = false;
    if (e.key === 'd' || e.key === 'D' || e.key === 'ㅇ') keys.d = false;
    if (e.key === 'w' || e.key === 'W' || e.key === 'ㅈ') keys.w = false;
    if (e.code === 'Space') keys.space = false;
    if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') keys.r = false;
});

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

// Map Geometry Definition
const platforms = [
    // Main Ground
    { x: 0, y: 820, width: WORLD_WIDTH, height: 80, type: 'concrete' },

    // Left Spawn Structures & Cover
    { x: 200, y: 680, width: 220, height: 20, type: 'steel' },
    { x: 300, y: 550, width: 180, height: 20, type: 'steel' },
    { x: 500, y: 740, width: 90, height: 80, type: 'crate' }, // Crate Cover

    // Central Multi-Level Tactical Tower
    { x: 800, y: 720, width: 120, height: 100, type: 'concrete' },
    { x: 950, y: 620, width: 300, height: 20, type: 'steel' },
    { x: 1100, y: 480, width: 250, height: 20, type: 'steel' },
    { x: 850, y: 380, width: 200, height: 20, type: 'steel' },
    { x: 1300, y: 740, width: 80, height: 80, type: 'crate' },

    // Trench / Low Ground Area with Elevated Platforms
    { x: 1500, y: 670, width: 220, height: 20, type: 'steel' },
    { x: 1800, y: 560, width: 280, height: 20, type: 'steel' },
    { x: 1700, y: 750, width: 110, height: 70, type: 'crate' },

    // Right Industrial Base
    { x: 2200, y: 700, width: 350, height: 120, type: 'concrete' },
    { x: 2300, y: 560, width: 250, height: 20, type: 'steel' },
    { x: 2600, y: 440, width: 200, height: 20, type: 'steel' },
    { x: 2850, y: 680, width: 180, height: 20, type: 'steel' },
    { x: 2450, y: 500, width: 60, height: 60, type: 'crate' },
];

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 56;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5.2;
        this.jumpForce = -13.5;
        this.isGrounded = false;
        
        this.maxHp = 100;
        this.hp = 100;

        // Weapon Stats
        this.maxAmmo = 30;
        this.ammo = 30;
        this.isReloading = false;
        this.reloadProgress = 0;
        this.reloadTime = 90; // frames (~1.5s)
        this.fireRate = 7; // frames delay between shots
        this.fireCooldown = 0;

        this.facingRight = true;
        this.aimAngle = 0;
    }

    update() {
        // Horizontal Movement
        if (keys.a) {
            this.vx = -this.speed;
            this.facingRight = false;
        } else if (keys.d) {
            this.vx = this.speed;
            this.facingRight = true;
        } else {
            this.vx *= 0.7; // friction
        }

        // Jump
        if (keys.w && this.isGrounded) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
            sounds.playJump();
        }

        // Apply Gravity
        this.vy += GRAVITY;

        // X Collision check
        this.x += this.vx;
        for (let p of platforms) {
            if (checkAABB(this, p)) {
                if (this.vx > 0) this.x = p.x - this.width;
                else if (this.vx < 0) this.x = p.x + p.width;
            }
        }

        // Y Collision check
        this.y += this.vy;
        this.isGrounded = false;
        for (let p of platforms) {
            if (checkAABB(this, p)) {
                if (this.vy > 0) { // Landing
                    this.y = p.y - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                } else if (this.vy < 0) { // Hitting ceiling
                    this.y = p.y + p.height;
                    this.vy = 0;
                }
            }
        }

        // World Bounds
        this.x = Math.max(0, Math.min(WORLD_WIDTH - this.width, this.x));

        // Aim angle calculation
        mouse.worldX = mouse.x + camera.x;
        mouse.worldY = mouse.y + camera.y;
        const centerX = this.x + this.width / 2;
        const centerY = this.y + 20; // shoulder height
        this.aimAngle = Math.atan2(mouse.worldY - centerY, mouse.worldX - centerX);

        // Reload Logic
        if (keys.r && !this.isReloading && this.ammo < this.maxAmmo) {
            this.startReload();
        }

        if (this.isReloading) {
            this.reloadProgress++;
            if (this.reloadProgress >= this.reloadTime) {
                this.ammo = this.maxAmmo;
                this.isReloading = false;
                this.reloadProgress = 0;
                updateHUD();
            }
        }

        // Firing Logic
        if (this.fireCooldown > 0) this.fireCooldown--;

        if (keys.space && this.fireCooldown <= 0) {
            this.shoot();
        }
    }

    startReload() {
        this.isReloading = true;
        this.reloadProgress = 0;
        sounds.playReload();
        updateHUD();
    }

    shoot() {
        if (this.isReloading) return;
        if (this.ammo <= 0) {
            this.startReload();
            return;
        }

        this.ammo--;
        this.fireCooldown = this.fireRate;
        sounds.playShoot();
        camera.triggerShake(4, 5);

        // Muzzle position
        const centerX = this.x + this.width / 2;
        const centerY = this.y + 20;
        const muzzleX = centerX + Math.cos(this.aimAngle) * 28;
        const muzzleY = centerY + Math.sin(this.aimAngle) * 28;

        // Recoil effect
        const spread = (Math.random() - 0.5) * 0.06;
        const finalAngle = this.aimAngle + spread;

        // Spawn Bullet
        bullets.push(new Bullet(muzzleX, muzzleY, finalAngle, true));

        // Spawn Particles (Muzzle Flash & Shell Ejection)
        particles.push(new MuzzleFlash(muzzleX, muzzleY, finalAngle));
        particles.push(new ShellCasing(centerX, centerY, this.facingRight ? -1 : 1));

        updateHUD();
    }

    takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        camera.triggerShake(8, 10);
        updateHUD();
        if (this.hp <= 0) {
            triggerGameOver();
        }
    }

    draw() {
        const renderX = this.x - camera.x;
        const renderY = this.y - camera.y;

        ctx.save();
        ctx.translate(renderX + this.width / 2, renderY + this.height / 2);

        // Realistic Tactical Soldier Drawing
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, this.height / 2, 16, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = '#2b303a';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-6, 10);
        ctx.lineTo(-8, 26);
        ctx.moveTo(6, 10);
        ctx.lineTo(8, 26);
        ctx.stroke();

        // Tactical Vest / Body
        ctx.fillStyle = '#3a4756'; // Dark Navy/Grey tactical
        ctx.fillRect(-12, -12, 24, 24);

        // Armor Plate
        ctx.fillStyle = '#1f242d';
        ctx.fillRect(-9, -8, 18, 18);

        // Head & Tactical Helmet
        ctx.fillStyle = '#252a34';
        ctx.beginPath();
        ctx.arc(0, -20, 10, 0, Math.PI * 2);
        ctx.fill();

        // Goggles / Visor
        ctx.fillStyle = '#00e5ff';
        const lookDir = mouse.worldX > this.x + this.width / 2 ? 1 : -1;
        ctx.fillRect(lookDir * 2, -22, lookDir * 6, 4);

        // Gun Assembly
        ctx.restore();

        // Draw Gun rotating towards Mouse
        const armX = renderX + this.width / 2;
        const armY = renderY + 20;
        ctx.save();
        ctx.translate(armX, armY);
        ctx.rotate(this.aimAngle);

        // Rifle Sprite
        ctx.fillStyle = '#111';
        ctx.fillRect(0, -3, 26, 6); // Barrel
        ctx.fillRect(6, 1, 6, 8);   // Magazine
        ctx.fillStyle = '#444';
        ctx.fillRect(10, -5, 10, 3); // Scope

        ctx.restore();
    }
}

class Enemy {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 56;
        this.vx = 0;
        this.vy = 0;
        this.speed = 2.2 + Math.random() * 0.8;

        this.hp = 100;
        this.maxHp = 100;

        this.shootTimer = Math.floor(Math.random() * 60);
        this.shootInterval = 100 + Math.random() * 60;

        this.facingRight = true;
    }

    update() {
        // Simple AI logic: Patrol or Follow Player if in range
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 700) {
            // Face Player
            this.facingRight = dx > 0;

            // Move towards player if not too close
            if (Math.abs(dx) > 150) {
                this.vx = this.facingRight ? this.speed : -this.speed;
            } else {
                this.vx = 0;
            }

            // Enemy Shooting
            this.shootTimer++;
            if (this.shootTimer >= this.shootInterval) {
                this.shootTimer = 0;
                this.shoot();
            }
        } else {
            this.vx = 0;
        }

        // Gravity & Collision
        this.vy += GRAVITY;
        this.x += this.vx;

        for (let p of platforms) {
            if (checkAABB(this, p)) {
                if (this.vx > 0) this.x = p.x - this.width;
                else if (this.vx < 0) this.x = p.x + p.width;
            }
        }

        this.y += this.vy;
        for (let p of platforms) {
            if (checkAABB(this, p)) {
                if (this.vy > 0) {
                    this.y = p.y - this.height;
                    this.vy = 0;
                }
            }
        }
    }

    shoot() {
        const centerX = this.x + this.width / 2;
        const centerY = this.y + 20;
        const angle = Math.atan2((player.y + 20) - centerY, (player.x + 14) - centerX);

        bullets.push(new Bullet(centerX, centerY, angle, false));
        particles.push(new MuzzleFlash(centerX + Math.cos(angle) * 20, centerY + Math.sin(angle) * 20, angle));
    }

    // Detailed Body Part Hit Detection Logic
    checkHitPart(bulletY) {
        const headTop = this.y;
        const headBottom = this.y + 16;
        const bodyBottom = this.y + 40;

        if (bulletY >= headTop && bulletY <= headBottom) {
            return 'HEAD'; // Headshot
        } else if (bulletY > headBottom && bulletY <= bodyBottom) {
            return 'BODY'; // Body shot
        } else {
            return 'LEG';  // Leg shot
        }
    }

    draw() {
        const renderX = this.x - camera.x;
        const renderY = this.y - camera.y;

        ctx.save();
        ctx.translate(renderX + this.width / 2, renderY + this.height / 2);

        // Enemy Design (Desert/Mercenary Outfit)
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, this.height / 2, 16, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = '#4a3b32';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-6, 10);
        ctx.lineTo(-8, 26);
        ctx.moveTo(6, 10);
        ctx.lineTo(8, 26);
        ctx.stroke();

        // Body (Mercenary Red/Brown Vest)
        ctx.fillStyle = '#8c3a2b';
        ctx.fillRect(-12, -12, 24, 24);

        // Head (Red Bandana / Camo)
        ctx.fillStyle = '#d9534f';
        ctx.beginPath();
        ctx.arc(0, -20, 10, 0, Math.PI * 2);
        ctx.fill();

        // Eye / Mask
        ctx.fillStyle = '#111';
        const dir = this.facingRight ? 1 : -1;
        ctx.fillRect(dir * 2, -22, dir * 6, 4);

        ctx.restore();

        // Enemy Health Bar
        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(renderX, renderY - 12, this.width, 5);
            ctx.fillStyle = '#ff3b30';
            ctx.fillRect(renderX, renderY - 12, (this.width * (this.hp / this.maxHp)), 5);
        }
    }
}

class Bullet {
    constructor(x, y, angle, isPlayer = true) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.speed = isPlayer ? 22 : 12;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.isPlayer = isPlayer;
        this.distanceTraveled = 0;
        this.maxDistance = 1400;
        this.markedForRemoval = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.distanceTraveled += this.speed;

        if (this.distanceTraveled >= this.maxDistance) {
            this.markedForRemoval = true;
        }

        // Environment Collision
        for (let p of platforms) {
            if (this.x >= p.x && this.x <= p.x + p.width &&
                this.y >= p.y && this.y <= p.y + p.height) {
                this.markedForRemoval = true;
                createImpactSpark(this.x, this.y);
                return;
            }
        }

        // Target Hits
        if (this.isPlayer) {
            for (let enemy of enemies) {
                if (checkAABB({ x: this.x - 2, y: this.y - 2, width: 4, height: 4 }, enemy)) {
                    this.markedForRemoval = true;
                    
                    // Hit Location & Multipliers
                    const hitPart = enemy.checkHitPart(this.y);
                    let damage = 35;
                    let text = '몸통!';
                    let color = '#ffcc00';

                    if (hitPart === 'HEAD') {
                        damage = 105; // Critical Headshot Instant/Heavy Kill
                        text = '헤드샷! (CRITICAL)';
                        color = '#ff3b30';
                        sounds.playHit(true);
                    } else if (hitPart === 'LEG') {
                        damage = 18;
                        text = '다리';
                        color = '#aaaaaa';
                        sounds.playHit(false);
                    } else {
                        sounds.playHit(false);
                    }

                    enemy.hp -= damage;
                    floatingTexts.push(new FloatingText(this.x, this.y - 15, text, color));
                    createBloodSplatter(this.x, this.y);

                    if (enemy.hp <= 0) {
                        killCount++;
                        updateHUD();
                    }
                    break;
                }
            }
        } else {
            // Hit Player
            if (checkAABB({ x: this.x - 2, y: this.y - 2, width: 4, height: 4 }, player)) {
                this.markedForRemoval = true;
                player.takeDamage(12);
                createBloodSplatter(this.x, this.y);
            }
        }
    }

    draw() {
        const renderX = this.x - camera.x;
        const renderY = this.y - camera.y;

        ctx.save();
        ctx.strokeStyle = this.isPlayer ? '#ffe600' : '#ff4500';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(renderX, renderY);
        ctx.lineTo(renderX - this.vx * 1.5, renderY - this.vy * 1.5); // Bullet Trail
        ctx.stroke();
        ctx.restore();
    }
}

// Particle Systems (Muzzle Flash, Sparks, Blood)
class MuzzleFlash {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.life = 3;
    }
    update() { this.life--; }
    draw() {
        if (this.life <= 0) return;
        const rx = this.x - camera.x;
        const ry = this.y - camera.y;
        ctx.save();
        ctx.translate(rx, ry);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#fff785';
        ctx.beginPath();
        ctx.arc(10, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class ShellCasing {
    constructor(x, y, dir) {
        this.x = x;
        this.y = y;
        this.vx = dir * (1 + Math.random() * 2);
        this.vy = -3 - Math.random() * 2;
        this.life = 40;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += GRAVITY;
        this.life--;
    }
    draw() {
        if (this.life <= 0) return;
        const rx = this.x - camera.x;
        const ry = this.y - camera.y;
        ctx.fillStyle = '#e67e22';
        ctx.fillRect(rx, ry, 4, 2);
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 45;
        this.vy = -1.2;
    }
    update() {
        this.y += this.vy;
        this.life--;
    }
    draw() {
        const rx = this.x - camera.x;
        const ry = this.y - camera.y;
        ctx.save();
        ctx.font = 'bold 15px Segoe UI, sans-serif';
        ctx.fillStyle = this.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillText(this.text, rx, ry);
        ctx.restore();
    }
}

function createImpactSpark(x, y) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 10,
            update() { this.x += this.vx; this.y += this.vy; this.life--; },
            draw() {
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(this.x - camera.x, this.y - camera.y, 2, 2);
            }
        });
    }
}

function createBloodSplatter(x, y) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 20,
            update() { this.x += this.vx; this.y += this.vy; this.life--; },
            draw() {
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(this.x - camera.x, this.y - camera.y, 3, 3);
            }
        });
    }
}

// Utility: Axis-Aligned Bounding Box Collision
function checkAABB(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

// Game Instances
let player = new Player(150, 700);
let enemies = [];
let bullets = [];
let particles = [];
let floatingTexts = [];
let killCount = 0;
let enemySpawnTimer = 0;
let isGameOver = false;

function spawnEnemy() {
    // Random Spawn on platform locations
    const spawnPoints = [
        { x: 100, y: 750 },
        { x: 900, y: 550 },
        { x: 1600, y: 600 },
        { x: 2400, y: 600 },
        { x: 3000, y: 750 }
    ];
    const pt = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
    enemies.push(new Enemy(pt.x, pt.y));
}

function updateHUD() {
    document.getElementById('hp-text').innerText = `${Math.ceil(player.hp)} %`;
    document.getElementById('hp-bar').style.width = `${Math.max(0, player.hp)}%`;
    document.getElementById('score-text').innerText = killCount;
    document.getElementById('ammo-current').innerText = player.ammo;

    const reloadStatus = document.getElementById('reload-status');
    if (player.isReloading) {
        reloadStatus.style.display = 'block';
    } else {
        reloadStatus.style.display = 'none';
    }
}

function triggerGameOver() {
    isGameOver = true;
    document.getElementById('final-stats').innerText = `최종 처치 수: ${killCount} 명`;
    document.getElementById('game-over').classList.add('active');
}

function restartGame() {
    player = new Player(150, 700);
    enemies = [];
    bullets = [];
    particles = [];
    floatingTexts = [];
    killCount = 0;
    isGameOver = false;
    document.getElementById('game-over').classList.remove('active');
    updateHUD();
}

// Render Realistic Background Environment
function drawEnvironment() {
    // Sky / Night Backdrop Gradient
    const bgGradient = ctx.createLinearGradient(0, 0, 0, screenHeight);
    bgGradient.addColorStop(0, '#0a0d14');
    bgGradient.addColorStop(1, '#1a222d');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, screenWidth, screenHeight);

    // Parallax Distant Industrial Silhouettes
    ctx.fillStyle = '#111620';
    for (let i = 0; i < 10; i++) {
        const bgX = (i * 350) - (camera.x * 0.2);
        ctx.fillRect(bgX, screenHeight - 400, 200, 400);
    }

    // Platforms
    for (let p of platforms) {
        const rx = p.x - camera.x;
        const ry = p.y - camera.y;

        if (rx + p.width < 0 || rx > screenWidth) continue; // Culling

        if (p.type === 'concrete') {
            ctx.fillStyle = '#2c3540';
            ctx.fillRect(rx, ry, p.width, p.height);
            ctx.fillStyle = '#1f252d';
            ctx.fillRect(rx, ry, p.width, 6); // Top edge highlight
        } else if (p.type === 'steel') {
            ctx.fillStyle = '#455a64';
            ctx.fillRect(rx, ry, p.width, p.height);
            // Steel girder detail pattern
            ctx.fillStyle = '#263238';
            for (let sx = 0; sx < p.width; sx += 20) {
                ctx.fillRect(rx + sx, ry + 3, 10, p.height - 6);
            }
        } else if (p.type === 'crate') {
            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(rx, ry, p.width, p.height);
            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 3;
            ctx.strokeRect(rx, ry, p.width, p.height);
            // Cross detail
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx + p.width, ry + p.height);
            ctx.moveTo(rx + p.width, ry);
            ctx.lineTo(rx, ry + p.height);
            ctx.stroke();
        }
    }
}

// Draw Aim Reticle
function drawCrosshair() {
    ctx.save();
    ctx.strokeStyle = 'rgba(52, 199, 89, 0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 12, mouse.y);
    ctx.lineTo(mouse.x + 12, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 12);
    ctx.lineTo(mouse.x, mouse.y + 12);
    ctx.stroke();
    ctx.restore();
}

// Initial Spawns
for (let i = 0; i < 4; i++) {
    spawnEnemy();
}

// Main Game Loop
function gameLoop() {
    if (!isGameOver) {
        // Player & Camera Updates
        player.update();
        camera.update(player.x + player.width / 2, player.y + player.height / 2);

        // Spawn Enemies periodically
        enemySpawnTimer++;
        if (enemySpawnTimer > 200 && enemies.length < 8) {
            spawnEnemy();
            enemySpawnTimer = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            if (bullets[i].markedForRemoval) {
                bullets.splice(i, 1);
            }
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].update();
            if (enemies[i].hp <= 0) {
                enemies.splice(i, 1);
            }
        }

        // Update Particles & Floating Text
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].update();
            if (floatingTexts[i].life <= 0) {
                floatingTexts.splice(i, 1);
            }
        }
    }

    // DRAW EVERYTHING
    ctx.clearRect(0, 0, screenWidth, screenHeight);

    drawEnvironment();

    // Render Game Entities
    for (let enemy of enemies) enemy.draw();
    player.draw();
    for (let bullet of bullets) bullet.draw();
    for (let particle of particles) particle.draw();
    for (let text of floatingTexts) text.draw();

    drawCrosshair();

    requestAnimationFrame(gameLoop);
}

// Start loop after page loads
window.onload = function() {
    gameLoop();
};
</script>
